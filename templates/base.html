<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TaskFlow{% endblock %} · TaskFlow Python</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo" style="background:#2f9e5b">PY</span> TaskFlow</a>
    <nav>
        <a href="{{ url_for('index') }}" class="{{ 'on' if active == 'tasks' }}">Tâches</a>
        <a href="{{ url_for('new_task') }}" class="{{ 'on' if active == 'new' }}">Nouvelle tâche</a>
        <a href="{{ url_for('platform_page') }}" class="{{ 'on' if active == 'platform' }}">Plateforme</a>
        <a href="{{ url_for('health') }}" target="_blank">Santé</a>
    </nav>
</header>

<main class="container {% block container_class %}{% endblock %}">
    {% with messages = get_flashed_messages() %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    TaskFlow · Python / Flask sur PaaS (Render) · TP Cloud Computing &amp; Virtualisation — INP-HB
</footer>
</body>
</html>
